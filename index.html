<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Someone Baked You a Playlist</title>
<meta name="description" content="Pick a cake, stick songs in as candles, and send it. They blow out the candles to hear what you baked them.">
<meta property="og:title" content="Someone Baked You a Playlist">
<meta property="og:description" content="Blow out the candles to hear the songs ♡">
<meta property="og:image" content="/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#cdb5ab">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sedgwick+Ave+Display&family=UnifrakturMaguntia&family=Nanum+Brush+Script&family=Yellowtail&family=Pinyon+Script&family=Gloock&family=Limelight&family=Anton&family=Caveat:wght@500;600&family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* layout: shop (a wall of cut-out cakes) -> poster editor (poster centre, dock right, drawer left)
   -> receive (same poster, lights off). Everything sits in a dusky rose room. */
:root {
  --room: #cdb5ab;
  --ink: #2c2124;
  --soft: #7d6a66;
  --brick: #b23a36;
  --glass: rgba(238, 228, 222, 0.8);
  --ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --hand: "Caveat", "Bradley Hand", cursive;
  --script: "Yellowtail", "Brush Script MT", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.5; background: radial-gradient(120% 90% at 50% 40%, #d8c3b9 0%, var(--room) 55%, #a98f86 100%); transition: background 0.9s ease; }
body.dark { background: #1a110f; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2); border-radius: 22px; box-shadow: 0 10px 40px rgba(40, 20, 20, 0.12); }

/* shop */
.shop { position: fixed; inset: 0; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 34px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(20px, env(safe-area-inset-left, 0px)); }
.shop h1 { margin: 0 auto; width: min(620px, 92%); }
.shop h1 svg { display: block; width: 100%; height: auto; }
.shop-note { text-align: center; margin: 0 auto 10px; max-width: 420px; color: var(--ink); }
.muted { margin: 0; color: var(--soft); font-size: 13px; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 28px var(--hand); color: var(--brick); }
.shop .sub { text-align: center; font: 600 26px var(--hand); color: var(--brick); margin: 14px 0 26px; }
.wall { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 20px; }
.wall button { min-width: 0; border: 0; background: none; padding: 10px; cursor: pointer; aspect-ratio: 1; display: grid; place-items: center; border-radius: 22px; transition: transform 0.25s, background 0.25s; }
.wall button:hover { transform: translateY(-6px) rotate(-1.5deg); background: rgba(255, 248, 242, 0.25); }
.wall img { display: block; min-width: 0; max-width: 100%; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 14px 14px rgba(60, 25, 20, 0.28)) sepia(0.12); }

.stage { position: fixed; inset: 0; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 22px) 270px calc(env(safe-area-inset-bottom, 0px) + 22px) 80px; }
body.receiving .stage { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 56px); }
#poster { display: block; box-shadow: 0 2px 4px rgba(40, 20, 20, 0.18), 0 26px 60px rgba(40, 20, 20, 0.3); touch-action: none; user-select: none; -webkit-user-select: none; }
#poster .item { cursor: grab; }
#poster .item.sel .body { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 1px #b23a36); }
body.receiving #poster .candle { cursor: pointer; }

.back { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); z-index: 3; font: 500 13px var(--ui); color: var(--ink); border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(246, 240, 236, 0.9); cursor: pointer; }
.dock { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); width: 220px; display: grid; gap: 12px; z-index: 3; }
.looks { display: flex; justify-content: space-between; gap: 6px; padding: 10px 12px; border-radius: 16px; }
.looks button { width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); }
.looks button[aria-checked="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn { font: 500 16px var(--ui); color: var(--ink); background: rgba(246, 240, 236, 0.95); border: 0; border-radius: 14px; padding: 14px; cursor: pointer; box-shadow: 0 1px 3px rgba(40, 20, 20, 0.12); }
.btn:hover { background: #fff; }
.btn.red { background: #c25b58; color: #fff; }
.btn.red:hover { background: #ad4643; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }
.ac { position: relative; display: grid; }
.hint { position: absolute; right: calc(100% + 16px); top: 50%; translate: 0 -50%; width: 236px; padding: 12px 16px; border-radius: 16px; display: grid; gap: 2px; pointer-events: none; font-size: 13.5px; line-height: 1.45; color: #4b3a37; animation: hint-in 0.5s ease both; }
.hint::after { content: ""; position: absolute; right: -6px; top: 50%; width: 14px; height: 14px; translate: 0 -50%; rotate: 45deg; background: rgba(238, 228, 222, 0.95); border-radius: 0 3px 0 0; }
.hint span:first-child { font-weight: 500; color: var(--ink); }
#add-candle.nudge { animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { box-shadow: 0 1px 3px rgba(40, 20, 20, 0.12), 0 0 0 0 rgba(194, 91, 88, 0.45); } 50% { box-shadow: 0 1px 3px rgba(40, 20, 20, 0.12), 0 0 0 7px rgba(194, 91, 88, 0); } }
@keyframes hint-in { from { opacity: 0; transform: translateY(6px); } }
.selbar { position: fixed; z-index: 4; display: flex; gap: 6px; translate: -50% -100%; }
.selbar button { font: 500 13px var(--ui); border: 0; border-radius: 999px; padding: 6px 12px; background: rgba(246, 240, 236, 0.96); box-shadow: 0 2px 8px rgba(40, 20, 20, 0.2); cursor: pointer; color: var(--ink); }

.tab { position: fixed; left: 0; top: 50%; translate: 0 -50%; z-index: 3; width: 44px; height: 96px; border: 0; border-radius: 0 14px 14px 0; background: rgba(246, 240, 236, 0.92); color: #6a5550; font-size: 22px; cursor: pointer; }
.drawer { position: fixed; z-index: 4; left: max(14px, env(safe-area-inset-left, 0px)); top: 20px; bottom: 20px; width: min(300px, calc(100% - 28px)); padding: 20px; overflow-y: auto; display: grid; align-content: start; gap: 14px; }
.drawer h3 { margin: 0; font-weight: 500; font-size: 16px; }
.drawer figure { margin: 0; display: grid; gap: 4px; }
.drawer figure svg { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 2px 8px rgba(40, 20, 20, 0.2); }
.drawer figcaption { font-size: 12.5px; color: var(--soft); }

.sheet { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(205, 181, 171, 0.2); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet .box { width: min(420px, 100%); padding: 24px; display: grid; gap: 14px; max-height: 88%; overflow-y: auto; position: relative; }
.sheet h3 { margin: 0; font-weight: 500; font-size: 18px; padding-right: 28px; }
.sheet p { margin: 0; color: var(--soft); }
.x { position: absolute; top: 12px; right: 12px; border: 0; background: none; font-size: 22px; color: var(--soft); cursor: pointer; line-height: 1; padding: 4px; }
input[type="text"] { font: 16px var(--ui); color: var(--ink); border: 0; background: rgba(255, 255, 255, 0.9); border-radius: 12px; padding: 12px 14px; width: 100%; min-width: 0; }
input[type="text"]:focus { outline: 2px solid var(--brick); }
.results { display: grid; gap: 6px; max-height: 44vh; overflow-y: auto; }
.results button { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: rgba(255, 255, 255, 0.8); border-radius: 12px; padding: 8px 10px; font: 15px var(--ui); color: var(--ink); cursor: pointer; }
.results button:hover { background: #fff; }
.results .art { width: 40px; height: 40px; border-radius: 6px; flex: none; object-fit: cover; }
.taste { justify-self: start; font: 500 13px var(--ui); border: 0; border-radius: 999px; padding: 6px 14px; background: rgba(255, 255, 255, 0.85); cursor: pointer; color: var(--ink); }
.results small { display: block; color: var(--soft); font-size: 12.5px; }
.styles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.styles button { border: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.75); cursor: pointer; padding: 8px 2px 6px; display: grid; justify-items: center; gap: 2px; font: 11.5px var(--ui); color: var(--ink); }
.styles button[aria-pressed="true"] { background: #fff; outline: 2px solid var(--ink); }
.styles svg { width: 22px; height: 84px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.12); }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.toppers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.toppers button { border: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.75); cursor: pointer; padding: 10px 4px 6px; display: grid; justify-items: center; gap: 2px; font: 12px var(--ui); color: var(--ink); }
.toppers svg { width: 48px; height: 60px; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.names label { display: grid; gap: 4px; font-size: 12px; color: var(--soft); }
.link { font: 13px ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, 0.85); border-radius: 10px; padding: 10px; user-select: all; }
.pair { display: flex; gap: 8px; flex-wrap: wrap; }
.pair .btn { flex: 1; font-size: 15px; padding: 12px; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-family: var(--hand); font-size: 24px; color: var(--brick); }
.menu li { display: flex; gap: 10px; align-items: baseline; border-bottom: 1px dashed rgba(178, 58, 54, 0.3); padding: 2px 0; }
.menu li::before { content: "☑"; font-size: 20px; }
.menu .t { flex: 1; min-width: 0; line-height: 1.1; }
.menu small { font-family: var(--ui); font-size: 12px; color: var(--soft); display: block; }
.menu li { flex-wrap: wrap; }
.menu .go { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; padding-left: 30px; margin-top: -2px; }
.menu a { font: 12px var(--ui); color: var(--ink); white-space: nowrap; }

.recv-hint { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 50%; translate: -50% 0; color: #ead6c8; font-family: var(--hand); font-size: 26px; z-index: 3; white-space: nowrap; pointer-events: none; transition: opacity 0.6s; }
.ticket { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); translate: -50% 0; width: min(330px, calc(100% - 32px)); padding: 14px 18px; z-index: 4; display: grid; gap: 4px; }
.ticket:has(.tk-art:not([hidden])) { padding-right: 82px; }
.ticket .no { font-family: var(--hand); font-size: 20px; color: var(--brick); line-height: 1; }
.ticket b { font-weight: 500; font-size: 17px; }
.ticket .bar { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
.ticket .bar i { flex: 1; height: 3px; background: rgba(0, 0, 0, 0.12); position: relative; overflow: hidden; border-radius: 2px; }
.ticket .bar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: var(--brick); }
.mic { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(14px, env(safe-area-inset-left, 0px)); z-index: 3; font: 500 13px var(--ui); border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(246, 240, 236, 0.9); cursor: pointer; color: var(--ink); }
.mic.on { background: #c25b58; color: #fff; }
.tk-art { position: absolute; right: 16px; top: 14px; width: 52px; height: 52px; border-radius: 8px; object-fit: cover; }
.exit { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px)); z-index: 3; font: 500 13px var(--ui); border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(246, 240, 236, 0.9); cursor: pointer; }

.flame .fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 2.4s ease-in-out infinite; }
.flame .glow { animation: breathe 3s ease-in-out infinite; }
.flame.ignite .fl, .flame.ignite .glow { transform-box: fill-box; transform-origin: 50% 100%; animation: ignite 0.8s cubic-bezier(.3, 1.5, .5, 1) both, flick 2.4s 0.8s ease-in-out infinite; }
.flame.out .fl, .flame.out .glow { animation: none; transform: scale(0.15, 0.05); opacity: 0; transition: transform 0.35s ease-in, opacity 0.35s; }
.smoke path { fill: none; stroke: rgba(236, 230, 222, 0.85); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 140; stroke-dashoffset: 140; animation: smoke 2.6s ease-out forwards; }
.smoke path:nth-child(2) { stroke-width: 2; animation-delay: 0.25s; }
@keyframes flick { 0%, 100% { transform: scale(1, 1) skewX(0); } 20% { transform: scale(0.97, 1.04) skewX(-1.5deg); } 45% { transform: scale(1.02, 0.97) skewX(1deg); } 70% { transform: scale(0.98, 1.03) skewX(-0.6deg); } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }
@keyframes ignite { 0% { transform: scale(0.05, 0.05); opacity: 0; } 60% { transform: scale(1.25, 1.4); opacity: 1; } 100% { transform: scale(1, 1); } }
@keyframes smoke { 0% { stroke-dashoffset: 140; opacity: 0.9; transform: translateY(0); } 100% { stroke-dashoffset: 0; opacity: 0; transform: translateY(-30px); } }
@media (prefers-reduced-motion: reduce) { .flame .fl, .flame .glow { animation: none !important; } .wall button:hover { transform: none; } }

/* the candle picker is a side panel, not a modal, so the cake stays in view while the candle changes on it */
.sheet.panel { inset: auto max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) auto; width: 380px; display: block; padding: 0; background: none; }
.sheet.panel .box { width: 100%; max-height: calc(100vh - 40px); box-shadow: 0 10px 40px rgba(40, 20, 20, 0.18); }
body.panel .dock, body.panel .tab { display: none; }
body.panel .stage { padding-right: 420px; }
.candle.draft .body { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.9)); }

@media (max-width: 760px) {
  .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 8px; }
  .stage { padding: calc(env(safe-area-inset-top, 0px) + 58px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 92px) max(16px, env(safe-area-inset-left, 0px)); }
  .dock { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .btn { font-size: 14px; padding: 12px 6px; }
  .sheet.panel { inset: auto 0 0 0; width: auto; }
  .sheet.panel .box { border-radius: 22px 22px 0 0; max-height: 48vh; padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); }
  .sheet.panel .results { max-height: 26vh; }
  .swatches { gap: 8px; }
  .swatches button { width: 26px; height: 26px; }
  body.panel .stage { padding-right: 16px; padding-top: 16px; padding-bottom: calc(48vh + 10px); }
  body.panel .looks, body.panel .back { display: none; }
  .looks { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(14px, env(safe-area-inset-right, 0px)); gap: 8px; padding: 7px 10px; }
  .looks button { width: 24px; height: 24px; }
  .hint { right: auto; left: 0; top: auto; bottom: calc(100% + 14px); translate: none; width: min(250px, calc(100vw - 32px)); }
  .hint::after { right: auto; left: 40px; top: auto; bottom: -6px; translate: none; border-radius: 0 0 3px 0; }
  .tab { top: 40%; height: 64px; width: 36px; }
  .recv-hint { font-size: 22px; top: calc(env(safe-area-inset-top, 0px) + 62px); }
}
</style>
</head>
<body>

<main class="shop" id="shop">
  <h1 id="logo" aria-label="Someone Baked You a Playlist"></h1>
  <p class="shop-note" id="shop-note" hidden></p>
  <div class="sub">Pick a cake</div>
  <div class="wall" id="wall"></div>
</main>

<div class="loading" id="loading" hidden>Unwrapping…</div>

<section class="stage" id="stage" hidden>
  <svg id="poster" viewBox="0 0 800 1000" role="img" aria-label="A cake poster with a candle for each song"></svg>
</section>

<button type="button" class="back" id="back" hidden>‹ Cakes</button>
<div class="selbar" id="selbar" hidden><button type="button" id="sel-edit">Edit</button><button type="button" id="sel-del">Remove</button></div>

<button type="button" class="tab" id="tab" aria-label="Cakes other people baked" aria-expanded="false">›</button>
<aside class="drawer glass" id="drawer" hidden>
  <button type="button" class="x" id="drawer-x" aria-label="Close">×</button>
  <h3>Fresh out of the oven</h3>
  <div id="others" style="display:grid;gap:16px"></div>
</aside>

<div class="dock" id="dock" hidden>
  <div class="looks glass" id="looks" role="radiogroup" aria-label="Poster style"></div>
  <div class="ac">
    <div class="hint glass" id="hint" hidden><span>Add a candle, pick a song.</span><span>Drag it anywhere on the cake.</span><span>Wrap &amp; send when it's ready.</span></div>
    <button type="button" class="btn" id="add-candle">Add Candle</button>
  </div>
  <button type="button" class="btn" id="add-topper">Add Topper</button>
  <button type="button" class="btn red" id="wrap">Wrap &amp; Send ♡</button>
</div>

<div id="recv" hidden>
  <div class="recv-hint" id="recv-hint">Tap a candle to blow it out</div>
  <button type="button" class="exit" id="exit">‹ Keep decorating</button>
  <button type="button" class="mic" id="mic">Blow with your mic</button>
  <div class="ticket glass" id="ticket" hidden>
    <img class="tk-art" id="tk-art" alt="" hidden>
    <span class="no" id="tk-no"></span>
    <b id="tk-song"></b>
    <span id="tk-artist" style="color:var(--soft)"></span>
    <div class="bar"><span>▶</span><i id="tk-bar"></i><span id="tk-time">0:00</span></div>
  </div>
</div>

<div class="sheet panel" id="s-candle" hidden>
  <div class="box glass">
    <button type="button" class="x" data-close aria-label="Close">×</button>
    <div id="c-step1" style="display:grid;gap:12px">
      <h3>Which song?</h3>
      <input type="text" id="q" placeholder="Song or artist" autocomplete="off" aria-label="Search songs">
      <div class="results" id="results"></div>
    </div>
    <div id="c-step2" style="display:grid;gap:14px" hidden>
      <h3 id="c-song"></h3>
      <button type="button" class="taste" id="c-taste" hidden>▶ Listen</button>
      <div class="styles" id="styles"></div>
      <div class="swatches" id="swatches"></div>
      <button type="button" class="btn red" id="c-done">Stick it in</button>
    </div>
  </div>
</div>

<div class="sheet" id="s-topper" hidden>
  <div class="box glass">
    <button type="button" class="x" data-close aria-label="Close">×</button>
    <h3>Add a topper</h3>
    <div class="toppers" id="topper-list"></div>
  </div>
</div>

<div class="sheet" id="s-wrap" hidden>
  <div class="box glass">
    <button type="button" class="x" data-close aria-label="Close">×</button>
    <h3>Who's it for?</h3>
    <div class="names">
      <label for="to">To<input type="text" id="to" maxlength="14" placeholder="Hyeeun"></label>
      <label for="from">From<input type="text" id="from" maxlength="12" placeholder="Jimin"></label>
    </div>
    <button type="button" class="btn red" id="wrap-go">Wrap it up</button>
  </div>
</div>

<div class="sheet" id="s-sent" hidden>
  <div class="box glass">
    <button type="button" class="x" data-close aria-label="Close">×</button>
    <h3 id="sent-title"></h3>
    <p>The songs stay a secret until they blow the candles out.</p>
    <div class="link" id="link"></div>
    <p class="muted" id="sent-note" hidden></p>
    <div class="pair"><button type="button" class="btn" id="copy">Copy link</button><button type="button" class="btn" id="share">Share…</button></div>
    <button type="button" class="btn red" id="preview">See it as them</button>
  </div>
</div>

<div class="sheet" id="s-menu" hidden>
  <div class="box glass">
    <h3 id="menu-title"></h3>
    <ol class="menu" id="menu"></ol>
    <div class="pair"><button type="button" class="btn" id="relight">Light them again</button><button type="button" class="btn red" id="bake">Bake one back</button></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const W = 800, H = 1000, MAX = 10;
  // shared links live at /c/<id>, so cake images need a root path there
  const ASSETS = location.pathname.startsWith("/c/") ? "/cakes/" : "cakes/";

  // sample catalogue standing in for the real song search (the live app would query the iTunes Search API)

  // ---------- state ----------

    }
  }

    drag.g.setAttribute("transform", `translate(${x1 - x0} ${y1 - y0})`); $("selbar").hidden = true;
  });
  svg.addEventListener("pointerup", () => { if (!drag) return; const d = drag; drag = null; state.sel = d.moved ? state.sel : state.sel === d.it.id ? null : d.it.id; render(); });
  function positionSelbar() {
    const it = state.items.find((i) => i.id === state.sel); if (!it || state.mode !== "decorate") { $("selbar").hidden = true; return; }
    const g = svg.querySelector(`.item[data-id="${it.id}"] .body`); if (!g) return; const r = g.getBoundingClientRect();
    const bar = $("selbar"); bar.hidden = false; bar.style.left = r.left + r.width / 2 + "px"; bar.style.top = Math.max(50, r.top - 10) + "px";
    $("sel-edit").hidden = it.type !== "candle";
  }
  $("sel-del").addEventListener("click", () => { state.items = state.items.filter((i) => i.id !== state.sel); state.sel = null; render(); });
  $("sel-edit").addEventListener("click", () => { const it = state.items.find((i) => i.id === state.sel); if (it) openCandle(it); });

  // ---------- sheets ----------
  const sheets = ["s-candle", "s-topper", "s-wrap", "s-sent", "s-menu"];
  const closeSheets = () => {
    if (!$("s-candle").hidden) dropPending();
    sheets.forEach((s) => ($(s).hidden = true)); stopTaste();
    if (document.body.classList.contains("panel")) { document.body.classList.remove("panel"); fitPoster(); render(); }
  };
  document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeSheets));
  sheets.forEach((s) => $(s).addEventListener("click", (e) => { if (e.target === $(s) && s !== "s-menu") closeSheets(); }));
  addEventListener("keydown", (e) => { if (e.key === "Escape") { closeSheets(); setDrawer(false); } });

  // ---------- add a candle: search a song; the candle goes straight onto the cake and changes live as you pick ----------
  let pending = null, backup = null, hits = [], searchT = 0, searchN = 0, lastPick = { style: "bubble", color: "blush" };
  function dropPending() {
    if (pending && !backup) state.items = state.items.filter((i) => i !== pending);
    if (pending && backup) Object.assign(pending, backup);
    if (pending) { delete pending.draft; render(); }
    pending = backup = null;
  }
  function openPanel() { document.body.classList.add("panel"); $("s-candle").hidden = false; fitPoster(); render(); }
  function openCandle(edit) {
    closeSheets(); setDrawer(false); state.sel = null;
    if (edit) { pending = edit; backup = { style: edit.style, color: edit.color }; pending.draft = true; showStep2(); }
    else { $("c-step1").hidden = false; $("c-step2").hidden = true; $("q").value = ""; hits = []; showResults(); setTimeout(() => $("q").focus(), 30); }
    openPanel();
  }
  $("add-candle").addEventListener("click", () => openCandle());
  function showResults(note) {
    const raw = $("q").value.trim();
    $("results").innerHTML = (note ? `<p class="muted">${note}</p>` : "") + hits.map((h, i) => `<button type="button" data-h="${i}">${h.art ? `<img class="art" src="${esc(h.art)}" alt="" loading="lazy">` : `<span class="art" style="background:${ART[(h.title.length + i) % ART.length]}"></span>`}<span>${esc(h.title)}<small>${esc(h.artist)}</small></span></button>`).join("") +
      (raw && !note ? `<button type="button" data-h="raw"><span class="art" style="background:rgba(255,255,255,.6)"></span><span>Use "${esc(raw)}"<small>if it isn't listed</small></span></button>` : "");
  }
  $("q").addEventListener("input", () => {
    clearTimeout(searchT);
    const q = $("q").value.trim();
    if (!q) { hits = []; showResults(); return; }
    searchT = setTimeout(async () => {
      const n = ++searchN; showResults("Looking…");
      const r = await searchSongs(q);
      if (n !== searchN) return;
      hits = r; showResults(r.length ? "" : "No match. You can still use what you typed.");
      if (!r.length) $("results").insertAdjacentHTML("beforeend", `<button type="button" data-h="raw"><span class="art" style="background:rgba(255,255,255,.6)"></span><span>Use "${esc(q)}"</span></button>`);
    }, 280);
  });
  $("results").addEventListener("click", (e) => {
    const b = e.target.closest("[data-h]"); if (!b) return;
    const song = b.dataset.h === "raw" ? { song: $("q").value.trim(), artist: "", art: "", preview: "", url: "" } : (({ title, artist, art, preview, url }) => ({ song: title, artist, art, preview, url }))(hits[+b.dataset.h]);
    // find the emptiest spot on the cake top and stand the candle there right away
    const taken = state.items.map((i) => [i.u, i.v]); let best = null;
    for (let k = 0; k < 40; k++) { const a = rnd() * 6.28, r = Math.sqrt(rnd()) * 0.85, u = Math.cos(a) * r, v = Math.sin(a) * r; const d = Math.min(9, ...taken.map(([x, y]) => Math.hypot(x - u, (y - v) * 0.7))); if (!best || d > best.d) best = { u, v, d }; }
    pending = { id: uid++, type: "candle", ...song, style: lastPick.style, color: lastPick.color, u: best.u, v: best.v, draft: true };
    backup = null;
    state.items.push(pending); ignited.add(pending.id);
    showStep2(); render();
  });
  const icon = (style, color) => { const c = candleSVG(style, color, 13, 158, "i" + style + color, 0, false); return `<svg viewBox="0 0 26 160"><defs><linearGradient id="${"i" + style + color}foot"/></defs><defs>${c.defs}</defs>${c.svg}</svg>`; };
  function showStep2() {
    $("c-step1").hidden = true; $("c-step2").hidden = false;
    $("c-song").textContent = pending.song + (pending.artist ? " — " + pending.artist : "");
    $("c-taste").hidden = !pending.preview;
    $("styles").innerHTML = sKeys.map((k) => `<button type="button" data-s="${k}" aria-pressed="${pending.style === k}">${icon(k, pending.color)}${STYLES[k].name}</button>`).join("");
    $("swatches").innerHTML = Object.entries(WAX).map(([k, v]) => `<button type="button" data-c="${k}" style="background:${k === "gold" ? "linear-gradient(135deg,#f6e3a4,#c99a3b,#f3d98a)" : k === "silver" ? "linear-gradient(135deg,#f4f5f7,#a9adb3,#e6e8eb)" : v}" aria-pressed="${pending.color === k}" aria-label="${k}"></button>`).join("");
    $("c-done").textContent = backup ? "Done" : "Stick it in";
  }
  // a quick listen while choosing
  const audio = new Audio(); audio.preload = "none";
  function stopTaste() { if (state.mode !== "receive") { audio.pause(); $("c-taste").textContent = "▶ Listen"; } }
  $("c-taste").addEventListener("click", () => {
    if (!audio.paused && audio.src === pending.preview) { stopTaste(); return; }
    audio.src = pending.preview; audio.currentTime = 0; audio.play().catch(() => {}); $("c-taste").textContent = "❚❚ Stop";
  });
  $("styles").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b && pending) { pending.style = b.dataset.s; showStep2(); render(); } });
  $("swatches").addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (b && pending) { pending.color = b.dataset.c; showStep2(); render(); } });
  $("c-done").addEventListener("click", () => {
    if (pending) { delete pending.draft; lastPick = { style: pending.style, color: pending.color }; }
    pending = backup = null;
    closeSheets(); render();
  });

  // ---------- toppers ----------
  $("topper-list").innerHTML = Object.entries(TOPPERS).map(([k, name]) => `<button type="button" data-k="${k}"><svg viewBox="-45 -120 90 130">${topperSVG(k, 0, 0, "tp" + k, 0)}</svg>${name}</button>`).join("");
  $("add-topper").addEventListener("click", () => { closeSheets(); setDrawer(false); $("s-topper").hidden = false; });
  $("topper-list").addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (!b) return; const a = rnd() * 6.28, r = Math.sqrt(rnd()) * 0.7; state.items.push({ id: uid++, type: "topper", kind: b.dataset.k, u: Math.cos(a) * r, v: Math.sin(a) * r }); closeSheets(); render(); });

  // ---------- wrap & send ----------
  const payload = () => ({
    cake: state.cake.id, look: state.look, to: state.to, from: state.from,
    items: state.items.map(({ type, song, artist, art, preview, url, style, color, kind, u, v }) => (type === "candle" ? { type, song, artist, art, preview, url, style, color, u: +u.toFixed(3), v: +v.toFixed(3) } : { type, kind, u: +u.toFixed(3), v: +v.toFixed(3) })),
  });
  $("wrap").addEventListener("click", () => { closeSheets(); setDrawer(false); $("s-wrap").hidden = false; setTimeout(() => $("to").focus(), 30); });
  $("wrap-go").addEventListener("click", async () => {
    state.to = $("to").value.trim(); state.from = $("from").value.trim(); state.sel = null; render();
    const btn = $("wrap-go"); btn.disabled = true; btn.textContent = "Wrapping…";
    let link = "", note = "";
    try { const { id } = await api("/api/cakes", { method: "POST", body: JSON.stringify(payload()) }, 10000); link = `${location.origin}/c/${id}`; }
    catch { note = "Couldn't reach the oven, so this is a preview only. Try again in a moment."; }
    btn.disabled = false; btn.textContent = "Wrap it up";
    closeSheets();
    $("sent-title").textContent = `Your playlist for ${state.to || "them"} is out of the oven.`;
    $("link").textContent = link || "—"; $("link").hidden = !link; $("copy").hidden = !link; $("share").hidden = !link || !navigator.share;
    $("sent-note").textContent = note; $("sent-note").hidden = !note;
    $("s-sent").hidden = false;
  });
  $("copy").addEventListener("click", () => { (navigator.clipboard ? navigator.clipboard.writeText($("link").textContent) : Promise.reject()).then(() => ($("copy").textContent = "Copied ♡"), () => { const r = document.createRange(); r.selectNodeContents($("link")); getSelection().removeAllRanges(); getSelection().addRange(r); }); });
  $("share").addEventListener("click", () => { navigator.share({ title: "Someone Baked You a Playlist", text: `${state.from || "Someone"} baked you a playlist ♡`, url: $("link").textContent }).catch(() => {}); });

  // ---------- receive: blow out a candle, hear its song ----------
  let playing = null, order = 0;
  function stopAudio() { audio.pause(); playing = null; }
  function receive() {
    closeSheets(); order = 0;
    state.items.forEach((i) => { if (i.type === "candle") { i.lit = true; ignited.add(i.id); } });
    $("ticket").hidden = true; $("recv-hint").style.opacity = 1;
    $("exit").textContent = state.shared ? "Bake one back" : "‹ Keep decorating";
    setMode("receive");
  }
  $("preview").addEventListener("click", receive);
  $("relight").addEventListener("click", receive);
  const backToEditor = () => { closeSheets(); state.items.forEach((i) => delete i.lit); setMode("decorate"); };
  const startOver = () => { closeSheets(); stopMic(); state.items = []; state.to = state.from = ""; state.shared = false; history.replaceState(null, "", "/"); setMode("shop"); };
  $("exit").addEventListener("click", () => (state.shared ? startOver() : backToEditor()));
  $("bake").addEventListener("click", startOver);

  function blowOut(it) {
    const g = svg.querySelector(`.candle[data-id="${it.id}"]`); if (!g || it.lit === false) return;
    const fl = svg.querySelector(`.flame[data-id="${it.id}"]`); fl.classList.remove("ignite"); fl.classList.add("out");
    const m = fl.getAttribute("transform").match(/translate\(([-\d.]+) ([-\d.]+)\)/), wx = +m[1], wy = +m[2];
    const sm = document.createElementNS("http://www.w3.org/2000/svg", "g"); sm.setAttribute("class", "smoke");
    sm.innerHTML = `<path d="M${wx} ${wy} c-6 -14 8 -22 0 -36 s6 -24 -2 -38"/><path d="M${wx + 2} ${wy} c6 -12 -6 -20 2 -32 s-4 -20 3 -30"/>`;
    fl.parentNode.appendChild(sm);
    it.lit = false; order++;
    $("tk-no").textContent = `No. ${order}`; $("tk-song").textContent = it.song; $("tk-artist").textContent = it.artist || "";
    $("tk-art").hidden = !it.art; if (it.art) $("tk-art").src = it.art;
    $("tk-time").textContent = it.preview ? "0:00" : "no preview"; $("tk-bar").style.setProperty("--p", "0%");
    $("ticket").hidden = false; $("recv-hint").style.opacity = 0;
    playing = it;
    if (it.preview) { audio.src = it.preview; audio.currentTime = 0; audio.play().catch(() => {}); } else audio.pause();
    const left = state.items.filter((i) => i.type === "candle" && i.lit !== false).length;
    setTimeout(() => { if (state.mode === "receive") render(); if (!left) setTimeout(showMenu, 1800); }, 1400);
  }
  svg.addEventListener("click", (e) => {
    if (state.mode !== "receive") return;
    const g = e.target.closest(".candle"); if (!g) return;
    const it = state.items.find((i) => i.id === +g.dataset.id); if (it) blowOut(it);
  });
  audio.addEventListener("timeupdate", () => {
    if (!playing || state.mode !== "receive") return;
    const d = audio.duration || 30, t = audio.currentTime;
    $("tk-bar").style.setProperty("--p", (t / d) * 100 + "%");
    $("tk-time").textContent = `0:${String(Math.floor(t)).padStart(2, "0")} / 0:${String(Math.round(d)).padStart(2, "0")}`;
  });
  function showMenu() {
    const cs = state.items.filter((i) => i.type === "candle");
    $("menu-title").textContent = `${state.from || "Someone"} baked you ${cs.length} song${cs.length > 1 ? "s" : ""}`;
    $("menu").innerHTML = cs.map((s) => {
      const q = encodeURIComponent(`${s.song} ${s.artist}`.trim());
      return `<li><span class="t">${esc(s.song)}<small>${esc(s.artist)}</small></span><span class="go"><a href="https://open.spotify.com/search/${q}" target="_blank" rel="noreferrer">Spotify ↗</a>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noreferrer">Apple ↗</a>` : ""}<a href="https://music.youtube.com/search?q=${q}" target="_blank" rel="noreferrer">YouTube ↗</a></span></li>`;
    }).join("");
    $("bake").textContent = state.shared ? "Bake one back" : "Bake another";
    $("ticket").hidden = true; $("s-menu").hidden = false;
  }

  // ---------- blow into the mic ----------
  // Blowing makes broadband rumble that sits mostly under ~1 kHz; a sustained loud low band (~0.25 s) counts as a blow.
  let mic = null;
  async function startMic() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.2; src.connect(an);
      const bins = new Uint8Array(an.frequencyBinCount), hiBin = Math.ceil(1000 / (ctx.sampleRate / an.fftSize));
      mic = { stream, ctx, raf: 0, since: 0, cool: 0 };
      $("mic").classList.add("on"); $("mic").textContent = "Listening… blow!";
      const tick = (t) => {
        an.getByteFrequencyData(bins);
        let low = 0; for (let i = 1; i < hiBin; i++) low += bins[i]; low /= hiBin - 1;
        const loud = low > 150;
        if (loud && !mic.since) mic.since = t;
        if (!loud) mic.since = 0;
        if (mic.since && t - mic.since > 250 && t > mic.cool) {
          const lit = state.items.filter((i) => i.type === "candle" && i.lit !== false).sort((a, b) => b.v - a.v);
          if (lit.length) blowOut(lit[0]);
          mic.since = 0; mic.cool = t + 900;
        }
        mic.raf = requestAnimationFrame(tick);
      };
      mic.raf = requestAnimationFrame(tick);
    } catch { $("mic").textContent = "Mic is off. Tap the candles instead."; $("mic").disabled = true; }
  }
  function stopMic() {
    if (!mic) return; cancelAnimationFrame(mic.raf); mic.stream.getTracks().forEach((t) => t.stop()); mic.ctx.close(); mic = null;
    $("mic").classList.remove("on"); $("mic").textContent = "Blow with your mic"; $("mic").disabled = false;
  }
  $("mic").hidden = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  $("mic").addEventListener("click", () => (mic ? stopMic() : startMic()));

  // ---------- open a shared cake from /c/<id> ----------
  async function openShared(id) {
    $("shop").hidden = true; $("loading").hidden = false;
    try {
      const c = await api(`/api/cakes?id=${encodeURIComponent(id)}`);
      state.cake = CAKES.find((k) => k.id === c.cake) || CAKES[0];
      state.look = LOOKS[c.look] ? c.look : "linen";
      state.to = c.to || ""; state.from = c.from || "";
      state.items = c.items.map((it) => ({ ...it, id: uid++ }));
      state.shared = true; $("exit").textContent = "Bake one back";
      $("loading").hidden = true; markLook(); receive();
    } catch {
      $("loading").hidden = true; history.replaceState(null, "", "/"); setMode("shop");
      $("shop-note").textContent = "That cake couldn't be found. Maybe it was eaten already. Bake a new one?"; $("shop-note").hidden = false;
    }
  }
  const shared = location.pathname.match(/^\/c\/([A-Za-z0-9]{6,16})\/?$/);
  if (shared) openShared(shared[1]); else setMode("shop");
})();
</script>
</body>
